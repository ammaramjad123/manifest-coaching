    <!-- ============================================================
         PRIMARY META  ·  Live domain: https://thepeacepractice.me

         NOTE: <title>, <meta name="description">, and <link rel="canonical">
         are intentionally NOT set here. Each page component under src/pages/
         renders its own via React 19's native head-tag support. Defining them
         here as well produces TWO of each tag in the DOM (React appends rather
         than replaces), which made every sub-page emit a canonical pointing at
         the homepage — telling Google not to index it. Keep them per-page only.
    ============================================================ -->
    <meta name="keywords" content="The Peace Practice, Ayana McKanney LCSW, clinical therapy, transformational coaching, ART therapy, Accelerated Resolution Therapy, trauma therapy, DBT, ACT, life coaching, immigration evaluations, professional training, New York, New Jersey, Rhode Island" />
    <meta name="author" content="Ayana Foluke McKanney, LCSW" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#c09050" />

    <!-- Favicon / app icons -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- ============================================================
         OPEN GRAPH / TWITTER CARD

         NOTE: og:*/twitter:* tags are intentionally NOT set here, for the
         same reason as title/description/canonical above — static tags
         here don't get deduped against the per-page React ones, so every
         route (including blog posts) would show the homepage's image
         when shared. Each page component sets its own via React 19's
         head-tag support (see HomePage.jsx, BlogPage.jsx, BlogPostPage.jsx).
    ============================================================ -->
