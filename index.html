    <!-- ============================================================
         PRIMARY META  ·  Live domain: https://thepeacepractice.me

         NOTE: <title>, <meta name="description">, and <link rel="canonical">
         are intentionally NOT set here. Each page component under src/pages/
         renders its own via React 19's native head-tag support. Defining them
         here as well produces TWO of each tag in the DOM (React appends rather
         than replaces), which made every sub-page emit a canonical pointing at
         the homepage — telling Google not to index it. Keep them per-page only.
    ============================================================ -->
    <meta name="keywords" content="The Peace Practice, Ayana McKanney LCSW, clinical therapy, transformational coaching, ART therapy, Accelerated Resolution Therapy, trauma therapy, DBT, ACT, life coaching, immigration evaluations, professional training, New York, New Jersey, Rhode Island" />

    <!-- Favicon / app icons -->

    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- ============================================================
         OPEN GRAPH / TWITTER CARD  ·  general fallback (logo image)

         NOTE: unlike title/canonical, these ARE kept here as static HTML
         on purpose. This is a client-rendered SPA with no SSR — most
         link-preview crawlers (WhatsApp, iMessage, Slack, LinkedIn,
         Twitter/X) do NOT execute JavaScript, so they only ever see this
         static markup, never the per-page tags React renders after JS
         runs. Removing this would leave those crawlers with NO image at
         all on every page. Blog posts get their own hero image instead
         of this fallback via middleware.js, which intercepts bot
         requests to /blog/:slug before they reach this file — see that
         file for details. Page components additionally render their own
         og:*/twitter:* tags for JS-executing crawlers/browsers; a brief
         tag duplication for those is an accepted, low-stakes tradeoff.
    ============================================================ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Peace Practice" />
    <meta property="og:title" content="The Peace Practice — Therapy, Coaching & Training" />
    <meta property="og:description" content="Compassionate clinical therapy, transformational coaching, and professional training with Ayana F. McKanney, LCSW. Licensed in NY, NJ & RI. Your journey, our partnership." />
    <meta property="og:url" content="https://www.thepeacepractice.me/" />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
